
name: Data Driven Framework

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]
  schedule:
    - cron: 00 18 * * *

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven  
    - name: Verify CI config
      run: |
        echo "Looking for Config-CI.properties..."
        find . -name "Config*"
    - name: Build and Execute Tests
      run: mvn clean test -Denv=CI

    - name: Upload Test Reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
          name: Test-Reports
          path: |
            reports/

    - name: Upload Screenshots
      if: always()
      uses: actions/upload-artifact@v4
      with:
          name: Screenshots
          path: screenshots/
